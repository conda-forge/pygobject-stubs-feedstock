{% set name = "pygobject-stubs" %}
{% set version = "2.18.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/pygobject_stubs-{{ version }}.tar.gz
  sha256: 1581bf005f8829cc5e6619b11774ed6c4f8f6725f3dda28f83ea2087709a76c3

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=65.0.0
    - pip
  run:
    - python >={{ python_min }}
    - pygobject >=3.55.0
    - typing_extensions

test:
  commands:
    - pip check
    - pip show pygobject-stubs
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/pygobject/pygobject-stubs
  summary: Typing stubs for PyGObject
  license: LGPL-2.1-only
  license_file: LICENSE

extra:
  recipe-maintainers:
    - MilkClouds
